<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated History | Interactive Visualizations</title>
<meta name="description" content="Explore 10 fascinating topics through animated, time-traveling visualizations — from tallest buildings to Indian Prime Ministers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <svg class="logo" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="Animated History Logo">
          <rect x="2" y="2" width="24" height="24" rx="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M14 6v8l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="14" cy="14" r="2" fill="currentColor"/>
        </svg>
        <h1 class="app-title">Animated History</h1>
      </div>

      <!-- Topic selector pills (desktop) -->
      <nav class="topic-nav" id="topic-nav" aria-label="Select topic"></nav>

      <!-- Topic dropdown (mobile) -->
      <select class="topic-select-mobile" id="topic-select-mobile" aria-label="Select topic"></select>

      <div class="header-right">
        <button id="export-video-btn" class="export-btn" aria-label="Export to Video">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Export Video
        </button>
        <button data-theme-toggle aria-label="Switch to light mode" class="theme-toggle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div id="sidebar-content">
          <!-- Dynamic content injected by app.js -->
          <div class="sidebar-loading">
            <div class="loading-spinner"></div>
            <p>Loading…</p>
          </div>
        </div>
      </aside>

      <!-- Viz Area -->
      <main class="viz-area" id="viz-area">
        <!-- Controls Bar -->
        <div class="controls-bar">
          <div class="year-control">
            <button class="year-nav" id="prev-btn" aria-label="Previous frame">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="current-year" id="current-year">—</span>
            <button class="year-nav" id="next-btn" aria-label="Next frame">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>

          <div class="slider-container">
            <input type="range" id="frame-slider" min="0" max="0" value="0" class="year-slider" aria-label="Select frame">
          </div>

          <div class="control-buttons">
            <button class="control-btn" id="play-btn" aria-label="Play animation" title="Animate through time">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
              <span class="btn-text">Play</span>
            </button>
            <button class="control-btn" id="speed-btn" aria-label="Toggle speed" title="Toggle playback speed">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              <span class="btn-text">1×</span>
            </button>
          </div>
        </div>

        <!-- Viz Content Wrapper (Split Screen) -->
        <div class="viz-content-wrapper" id="viz-content-wrapper">
          <!-- Left side: The SVG map / bar chart -->
          <div class="viz-container" id="viz-container">
            <!-- Loading state -->
            <div class="viz-loading" id="viz-loading">
              <div class="loading-spinner"></div>
              <p>Loading visualization…</p>
            </div>
            <!-- Tooltip -->
            <div class="viz-tooltip" id="tooltip" style="display:none;">
              <div class="tooltip-title" id="tooltip-title"></div>
              <div class="tooltip-body" id="tooltip-body"></div>
            </div>
            
            <!-- Watermark -->
            <div class="viz-watermark" id="viz-watermark">
              <svg width="12" height="12" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="24" height="24" rx="4"/><path d="M14 6v8l4 4"/><circle cx="14" cy="14" r="2" fill="currentColor"/></svg>
              Animated History
            </div>
          </div>

          <!-- Right side: The Dynamic Image Panel (e.g. comparing height) -->
          <div class="viz-image-display" id="viz-image-display">
            <div class="viz-image-inner">
               <img id="viz-dynamic-img" src="" alt="" style="display: none;" />
            </div>
          </div>
        </div>

        <!-- Legend -->
        <div class="viz-legend" id="viz-legend" style="display:none;">
          <div class="legend-items" id="legend-items"></div>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Data sourced from publicly available historical records. For educational and informational purposes.</p>
    </footer>
  </div>

  <!-- Core data config (always loaded) -->
  <script src="./data/topic-config.js"></script>

  <!-- Visualization modules (always loaded — small files) -->
  <script src="./visualizations/ranking-viz.js"></script>
  <script src="./visualizations/map-viz.js"></script>
  <script src="./visualizations/timeline-viz.js"></script>
  <script src="./lib/html2canvas.min.js"></script>

  <!-- App orchestrator (last) -->
  <script src="./app.js"></script>
</body>
</html>
